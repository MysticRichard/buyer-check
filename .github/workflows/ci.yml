name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Acceptance cases (A1-A41)
        run: node tests/run_cases.mjs

      - name: Score consistency (V5/V6, python/node parity)
        run: node tests/consistency.mjs

      - name: Script consistency (E3, python/node parity)
        run: node tests/consistency_scripts.mjs

      - name: Debug render_card CLI
        if: failure()
        run: |
          echo "node=$(node --version) python=$(python --version 2>&1)"
          node scripts/render_card.mjs tests/fixtures/card_harbor.json --json > /tmp/js_card.json 2> /tmp/js_card.err || true
          python scripts/render_card.py tests/fixtures/card_harbor.json --json > /tmp/py_card.json 2> /tmp/py_card.err || true
          wc -c /tmp/js_card.json /tmp/py_card.json || true
          echo "--- js stderr ---"; head -c 400 /tmp/js_card.err || true
          echo "--- py stderr ---"; head -c 400 /tmp/py_card.err || true
          node -e "JSON.parse(require('fs').readFileSync('/tmp/js_card.json','utf8'));console.log('js json ok')" || true
          python -c "import json;json.load(open('/tmp/py_card.json'));print('py json ok')" || true
          node scripts/render_card.mjs --ladder > /tmp/js_ladder.json 2> /tmp/js_ladder.err || true
          python scripts/render_card.py --ladder > /tmp/py_ladder.json 2> /tmp/py_ladder.err || true
          wc -c /tmp/js_ladder.json /tmp/py_ladder.json || true

      - name: account_check acceptance (F2)
        run: node tests/account_check_cases.mjs

      - name: check_sources acceptance (F3)
        run: node tests/check_sources_cases.mjs

      - name: ip_check acceptance (G1-G6)
        run: node tests/ip_check_cases.mjs

      - name: phone_check enrichment (H1-H5)
        run: node tests/phone_check_enrich_cases.mjs

      - name: Behavior eval self-check (E4)
        run: node tests/eval/score_eval.mjs --self

      - name: Privacy scan (V2)
        run: node scripts/privacy_scan.mjs

      - name: Build lean submission bundle (P1)
        run: node scripts/build_submission.mjs

      - name: Submission bundle tests (S2)
        run: node tests/run_cases.mjs
        working-directory: dist/submission

      - name: Submission bundle privacy scan (S3)
        run: node scripts/privacy_scan.mjs dist/submission
